; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; NOTE (new hardware / no SIM module): "board = esp32dev" assumes the new
; board still uses a classic ESP32 (matches sdkconfig.esp32dev's
; CONFIG_IDF_TARGET=esp32). If the new board actually uses an ESP32-S3,
; ESP32-C3, etc., change "board" accordingly and delete sdkconfig.esp32dev
; so PlatformIO regenerates a fresh one for that target on next build.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

dependencies:
  espressif/esp-tflite-micro: "^1.3.0"

